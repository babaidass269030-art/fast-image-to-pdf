name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Web App & Prepare Assets
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/*
          cp -r dist/* android/app/src/main/assets/

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias fastpdf -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=FastPDF, OU=Dev, O=QuickToolbox, L=City, S=State, C=IN"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:123456 --out android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FastPDF-release-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          
